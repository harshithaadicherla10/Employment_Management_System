<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- Header -->
    <div class="header">
        <h1>Employment Management System</h1>
    </div>

    <div class="container">

        <!-- Stats cards -->
        <div class="stats">
            <div class="stat-card">
                <h3>Total Employees</h3>
                <p>{{ employees|length }}</p>
            </div>
            <div class="stat-card">
                <h3>Departments</h3>
                <p>5</p>
            </div>
            <div class="stat-card">
                <h3>Admin</h3>
                <p>Active</p>
            </div>
        </div>

        <!-- Actions -->
        <div class="action-bar">
            <a href="/logout" class="btn logout-btn">Logout</a>
            <a href="/add_employee" class="btn add-btn">+ Add Employee</a>
        </div>

        <!-- Employee Table -->
        <div class="table-wrapper">
            <table class="employee-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Salary</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in employees %}
                    <tr>
                        <td>{{ e.eid }}</td>
                        <td>{{ e.ename }}</td>
                        <td>
                            <span class="dept-badge">{{ e.edept }}</span>
                        </td>
                        <td>₹ {{ e.esalary }}</td>
                        <td>{{ e.ephone }}</td>
                        <td>
                            <a href="/edit_employee/{{ e.eid }}" class="action-btn edit">Edit</a>
                            <a href="/delete_employee/{{ e.eid }}" class="action-btn delete"
                                onclick="return confirm('Delete this employee?')">Delete</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>


    </div>

</body>

</html>
